<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>demo</title>
<style>
  body{font-family:-apple-system,'Segoe UI',sans-serif;margin:0;color:#1e293b;padding-top:150px}
  .hero{text-align:center;padding:80px 24px;background:linear-gradient(135deg,#eef2ff,#f5f3ff)}
  .hero h1{font-size:40px;margin:0 0 14px}
  .hero button{padding:13px 30px;background:#6366f1;color:#fff;border:none;border-radius:10px}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:960px;margin:0 auto;padding:56px 24px}
  .feature{padding:24px;border:1px solid #e2e8f0;border-radius:14px}
</style></head>
<body>
<section class="hero"><h1>더 빠르게 만들고, 더 쉽게 편집하세요</h1><p>데모 페이지입니다.</p><button>지금 시작하기</button></section>
<section class="features">
  <div class="feature"><h3>⚡ 실시간 편집</h3><p>클릭 한 번으로 수정합니다.</p></div>
  <div class="feature"><h3>🎨 정밀 스타일</h3><p>패널에서 바로 조정합니다.</p></div>
  <div class="feature"><h3>📥 즉시 저장</h3><p>깨끗한 HTML로 저장합니다.</p></div>
</section>
</body></html>
